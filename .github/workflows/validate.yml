# =============================================================================
# CODEX ENIGMATICA — KALİTE KAPILARI
# =============================================================================
# Her push'ta koşar. Kalite düşerse KIRMIZI yanar ve ilerleme durur.
#
# TASARIM: bu iş akışı ÜÇÜNCÜ TARAF PAKET KURMAZ. Bütün kalite kapıları
# Python standart kütüphanesiyle yazıldı; iş akışı saniyeler içinde biter.
# Yazım fazlarında günde onlarca push olur ve iki dakikalık kurulum beklemek
# disiplini öldürür. Ağır bağımlılıklar build.yml'e aittir.
# =============================================================================
name: validate

on:
  push:
    branches: [main, 'faz/**', 'fix/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: kapı seviyesini oku
    runs-on: ubuntu-latest
    outputs:
      level: ${{ steps.read.outputs.level }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        run: |
          LEVEL="phase0"
          if [ -f .gate ]; then LEVEL="$(tr -d '[:space:]' < .gate)"; fi
          case "$LEVEL" in
            phase0|phase1|phase2|phase3|phase4|phase5|release) ;;
            *) echo "::error::.gate geçersiz: '$LEVEL'"; exit 1 ;;
          esac
          echo "level=$LEVEL" >> "$GITHUB_OUTPUT"
          echo "::notice::kapı seviyesi = $LEVEL"

  data:
    name: veri bütünlüğü ve kapsam
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: şema, kimlik ve kapsam
        run: |
          python3 04_BUILD/validate_spec.py \
            --gate "${{ needs.gate.outputs.level }}" \
            --verbose --json 06_REPORTS/tracked/spec-validation.json
      - name: araştırma ve künye kayıtları
        run: |
          LEVEL="$(tr -d '[:space:]' < .gate)"
          python3 04_BUILD/validate_research.py --gate "$LEVEL" --verbose
      - name: mekanizma çeşitliliği
        run: |
          if [ -f 04_BUILD/qa_taxonomy.py ]; then
            python3 04_BUILD/qa_taxonomy.py --verbose --json 06_REPORTS/qa-taxonomy.json
          fi
      # ⚠ ARTEFAKT YÜKLEME YALNIZCA 06_REPORTS/tracked/ İÇİNDİR.
      # Doğrulayıcı raporları yapıları gereği çözüm içeriğine yaklaşır
      # (qa_uniqueness "hangi adaylar reddedildi" sorusunu yanıtlar ve o
      # adaylar CEVAP ADAYLARIDIR). Bir artefakt public depoya bakmayan
      # birinin bile indirebileceği bir dosyadır.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: data-reports
          path: 06_REPORTS/tracked/*.json
          if-no-files-found: ignore

  structure:
    name: depo, belge ve manuscript koruması
    runs-on: ubuntu-latest
    steps:
      # Sızıntı denetimi `git ls-files` okur — çalışan bir depo gerekir.
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      # ⭑ Bu adım ÇÖZÜM SIZINTISINI de denetler ve bu projede VAROLUŞSALDIR:
      # public depoya giren bir çözüm ürünü yayımlanmadan değersizleştirir
      # ve hata geri alınamaz (git geçmişi).
      - name: yapı, belge ve ÇÖZÜM sızıntısı denetimi
        run: python3 04_BUILD/validate_structure.py --verbose --json 06_REPORTS/tracked/structure.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: structure-report
          path: 06_REPORTS/tracked/structure.json
          if-no-files-found: ignore

  gates-selftest:
    name: KAPILARIN KENDİ TESTİ
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      # Bu, hattın EN ÖNEMLİ testidir. Metin yokken yeşil kalan bir hat,
      # kusur geldiğinde de yeşil kalabilir. Bu test o riski kapatır.
      - name: kapılar gerçekten ısırıyor mu
        run: python3 05_TESTS/selftest.py --verbose

  text:
    name: metin kalite kapıları
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: manuscript bu depoda var mı
        run: |
          if [ -f 02_MANUSCRIPT/book.json ]; then
            echo "::warning::02_MANUSCRIPT/book.json depoda GÖRÜNÜYOR — .gitignore § ① ihlali olabilir"
          else
            echo "::notice::manuscript depoda yok (.gitignore § ①) — metin kapıları boş koşar; körlüğü selftest kapatır"
          fi
      - name: metin kapıları
        run: |
          LEVEL="$(tr -d '[:space:]' < .gate)"
          RAN=0
          for g in qa_answerspace qa_effort qa_experience qa_plate_data qa_plate_readability qa_handoff qa_readerpack qa_crossref qa_editorial english_readiness qa_solvability qa_uniqueness qa_hints qa_dependency qa_meta qa_length qa_voice qa_echo qa_drift; do
            if [ -f "04_BUILD/$g.py" ]; then
              echo "▸ $g"
              python3 "04_BUILD/$g.py" --gate "$LEVEL" --verbose || exit 1
              RAN=$((RAN+1))
            fi
          done
          echo "::notice::$RAN metin kapısı koştu"

  canary:
    name: ⭑ ÇÖZÜM KANARYASI ⭑
    runs-on: ubuntu-latest
    steps:
      # Kanarya ALAN ADI değil CEVABIN KENDİSİNİ arar: dosya içeriği,
      # dosya adları ve COMMIT MESAJLARI. Commit mesajı taraması için tam
      # geçmiş gerekir — sığ klonda mesajlar yoktur.
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: cevap sızıntısı
        env:
          ENIGMATICA_CANARY_SALT: ${{ secrets.ENIGMATICA_CANARY_SALT }}
        run: |
          LEVEL="$(tr -d '[:space:]' < .gate)"
          python3 04_BUILD/qa_solution_leak.py --gate "$LEVEL" --verbose

  kill-gate:
    name: ⛔ ÖLDÜRME KAPISI ⛔
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      # Karar ÜRETİR, kalite ölçmez. phase2 ve sonrasında BLOKLAYICIDIR;
      # öncesinde kararı yazdırır ama iş akışını kırmaz — çünkü o kapı
      # seviyesi henüz bu kararı gerektirmiyor.
      #
      # ⚠ CI'da korumalı katman YOKTUR, dolayısıyla çözücü kaydı da yoktur:
      # burada karar HER ZAMAN "BLOCKED" çıkar ve bu DOĞRUDUR. Gerçek karar
      # kurucunun yerel deposunda, gerçek oturum kayıtlarıyla üretilir.
      - name: öldürme kapısı kararı
        run: |
          LEVEL="${{ needs.gate.outputs.level }}"
          set +e
          python3 04_BUILD/kill_gate.py --json 06_REPORTS/tracked/kill-gate-report.json
          CODE=$?
          set -e
          case "$LEVEL" in
            phase2|phase3|phase4|phase5|release) exit $CODE ;;
            *) echo "::notice::kapı $LEVEL — öldürme kapısı kararı bilgilendirmedir"; exit 0 ;;
          esac

  production-model:
    name: sayfa bütçesi ve telif modeli
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      # SAYFA BÜTÇESİ ÇİFT İŞ GÖRÜR: fiyat modelini belirler VE Kapı V'i
      # bağlar (öz-göndergesel bulmacalar sayfa numaralarına dayanır).
      - name: sürüm, telif ve sayfa bütçesi
        run: |
          for s in editions page_budget; do
            if [ -f "04_BUILD/$s.py" ]; then
              python3 "04_BUILD/$s.py" --verbose || exit 1
            else
              echo "::notice::$s.py henüz yok — Faz 1/2 teslimatı"
            fi
          done

  summary:
    name: özet
    needs: [data, structure, gates-selftest, text, canary, kill-gate, production-model]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          {
            echo "## Codex Enigmatica · kalite kapıları"
            echo ""
            echo "| Kapı | Sonuç |"
            echo "|---|---|"
            echo "| veri bütünlüğü ve kapsam | ${{ needs.data.result }} |"
            echo "| depo, belge, **ÇÖZÜM koruması** | ${{ needs.structure.result }} |"
            echo "| **kapıların kendi testi** | ${{ needs.gates-selftest.result }} |"
            echo "| metin kapıları | ${{ needs.text.result }} |"
            echo "| **çözüm kanaryası** | ${{ needs.canary.result }} |"
            echo "| **⛔ öldürme kapısı** | ${{ needs.kill-gate.result }} |"
            echo "| sayfa bütçesi ve telif | ${{ needs.production-model.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ]; then
            {
              echo ""
              echo "**Kalite düştü. Düzeltilmeden ilerleme yok.**"
              echo ""
              echo "Yerelde aynı komutlar: \`./04_BUILD/qa_all.sh\`"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
